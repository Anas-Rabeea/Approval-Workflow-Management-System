server:
  shutdown: GRACEFUL
  port: 8080

spring:

  application:
    name: approval-sys

  datasource:
    name: postgres_db
    # use localhost when deving , or falls back if env vars are present
    url: jdbc:postgresql://localhost:${POSTGRES_DB_HOST_PORT:5432}/${POSTGRES_DB:app_db}
    username: ${POSTGRES_USER:app_user}
    password: ${POSTGRES_PASSWORD:app_password123!}
    driver-class-name: org.postgresql.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      connection-timeout: 60000
      max-lifetime: 90000
      idle-timeout: 60000


  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations:
      - classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: true
#    postgresql:
#      transactional-lock: true
#    user: ${POSTGRES_USER}
#    password: ${POSTGRES_PASSWORD}
#    schemas: ${POSTGRES_DB}
#    url: jdbc:postgresql://localhost:${POSTGRES_DB_HOST_PORT:5432}/${POSTGRES_DB:app_db}

  data:
    redis:
      host: localhost
      port: ${REDIS_HOST_PORT:6379}
      password: ${REDIS_PASSWORD:redis_password123!}

